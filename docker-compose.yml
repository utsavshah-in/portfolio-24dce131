services:
  # ==========================================
  # Database Service: MongoDB
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: awdf-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - awdf-network
    # Port is not published to host by default to follow security best practices.
    # To connect using MongoDB Compass from your host machine, uncomment the following line:
    # ports:
    #   - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Backend Service: Node.js / Express API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: awdf-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Uses the Docker service name 'mongodb' instead of localhost
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/taskdb}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_practical11_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      NOTIFICATION_DELAY_MS: ${NOTIFICATION_DELAY_MS:-2000}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - awdf-network
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:5000/api/cache/stats', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Frontend Service: React + Vite on Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: awdf-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - awdf-network

# ==========================================
# Persistent Storage Volumes
# ==========================================
volumes:
  mongodb_data:
    driver: local

# ==========================================
# Network Configuration
# ==========================================
networks:
  awdf-network:
    driver: bridge
