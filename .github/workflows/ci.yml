name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================
  # Job 1: Frontend Verification (Install, Lint, Production Build)
  # =============================================================
  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify production build (Vite code splitting)
        run: npm run build

  # =============================================================
  # Job 2: Backend Verification (Install, Unit Tests, Integration Tests)
  # =============================================================
  backend-ci:
    name: Backend CI (Unit & Integration Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run fast unit tests (Database-independent)
        run: npm run test:unit

      - name: Run full integration tests (with containerized MongoDB)
        env:
          MONGO_URI: mongodb://localhost:27017/awdf_ci_test
          PORT: 5000
          JWT_SECRET: ci_pipeline_jwt_secret_token_12345
          CACHE_ENABLED: "true"
          NOTIFICATION_DELAY_MS: "300"
        run: npm test
